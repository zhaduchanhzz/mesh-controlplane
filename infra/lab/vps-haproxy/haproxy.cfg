# P13f (owner decision 2026-11-26, D9a): a separate HAProxy instance on the
# VPS (116.118.3.46) for the mesh-controlplane lab ports 8443-8445 ONLY. It
# replaces the three systemd-socket-proxyd forwarders (mesh-cp-proxy,
# mesh-boot-proxy, mesh-c2-proxy) one for one. NOT APPLIED: see README.md.
#
# It does not touch the MeshGuard HAProxy (80/443), stund (3478/udp),
# postfix/opendkim (25/587) or WireGuard (51820/udp, wg-mesh 51821/udp). It
# binds only 116.118.3.46:8443-8445, which the existing nft rules already
# accept; it has no stats page, no HTTP mode and no admin socket outside its
# runtime directory.
#
# Ports:
#   8443 -> mc-cp 10.99.77.2:8443 (cluster c1)   plain TCP, as before
#   8444 -> mc-cp 10.99.77.2:8444 (bootstrap)    PROXY protocol v2 (B7)
#   8445 -> mc-cp 10.99.77.2:8445 (cluster c2)   plain TCP, as before
#
# Only the bootstrap listener accepts PROXY v2 in P13f (mesh-bootstrap
# -proxy-protocol-from 10.99.77.1/32); the cluster listeners do not parse it
# yet, so 8443/8445 carry the same bytes as with socket-proxyd. TLS is not
# terminated here: every byte after the PROXY header is the client's.

global
    log stdout format short daemon
    maxconn 2048
    # The runtime directory is created by systemd (RuntimeDirectory=); the
    # socket is reachable by root only and is not a network listener.
    stats socket /run/mesh-lab-haproxy/admin.sock mode 600 level admin
    # The instance runs as a systemd DynamicUser; it never needs root after
    # start (all ports are above 1024).
    hard-stop-after 30s

defaults
    mode tcp
    log global
    option tcplog
    option dontlognull
    option clitcpka
    option srvtcpka
    timeout connect 5s
    # /ts2021 Noise sessions and map long polls stay open for long; the
    # client and the server send keepalives well within 10 minutes.
    timeout client 10m
    timeout server 10m
    timeout client-fin 30s
    timeout server-fin 30s
    # As --connections-max=512 of each socket-proxyd unit.
    maxconn 512

frontend lab_c1
    bind 116.118.3.46:8443
    default_backend lab_c1

backend lab_c1
    server mc-cp 10.99.77.2:8443

frontend lab_bootstrap
    bind 116.118.3.46:8444
    default_backend lab_bootstrap

backend lab_bootstrap
    # B7: the client address reaches mesh-bootstrap in a PROXY v2 header;
    # mesh-bootstrap trusts it only from 10.99.77.1 (this end of wg-mesh).
    server mc-cp 10.99.77.2:8444 send-proxy-v2

frontend lab_c2
    bind 116.118.3.46:8445
    default_backend lab_c2

backend lab_c2
    server mc-cp 10.99.77.2:8445

# Local HAProxy of each PG node (P13b, ADR 0011 §D). Installed as
# /etc/haproxy/haproxy.cfg on mc-pg-01/02 by infra/lab/pg/setup-pgbouncer.sh.
#
# PgBouncer on the same node sends every server connection to 127.0.0.1:5000;
# HAProxy forwards it to whichever node's Patroni answers `GET /primary` with
# 200. Only one node does at a time (Patroni leader key in etcd).
#
# - inter 1s, fall 2: a demoted or dead primary is marked down within ~2 s.
# - on-marked-down shutdown-sessions: the TCP sessions to a node marked down
#   are cut, so PgBouncer's server connections to the old primary die at once
#   (no lingering session on a node that came back as a read-only replica).
# - rise 2: a node must answer 200 twice before it takes traffic.
# - option redispatch 1 + retries 3: a server connect that fails is retried on
#   a server picked again from those UP at that moment, never on the same
#   one. Without it (measured 2026-11-26, switchover mc-pg-01 -> mc-pg-02,
#   evidence/P13b-pgbouncer-ha.md §7): a connect started while the old
#   primary was still marked UP but restarting was retried on that same node
#   until it came back as a REPLICA, 2 s after it had been marked DOWN; that
#   session was never cut (shutdown-sessions acts only on sessions open at
#   the moment of marking down) and PgBouncer kept the read-only server
#   connection in its pool: 46 "cannot execute INSERT in a read-only
#   transaction" errors over 27 s, until the pool was dropped.
# - Listens on loopback only: nothing outside the node reaches PostgreSQL
#   through it (nftables keeps 5432 closed to the cluster VMs).
global
	log /dev/log local0 notice
	maxconn 4000
	user haproxy
	group haproxy
	daemon
	stats socket /run/haproxy/admin.sock mode 660 level admin

defaults
	mode tcp
	log global
	option tcplog
	option dontlognull
	timeout connect 1s
	retries 3
	option redispatch 1
	timeout check 1s
	# Longer than PgBouncer's server_idle_timeout (300 s) so HAProxy never
	# cuts an idle pooled connection first; PgBouncer's TCP keepalive
	# (tcp_keepidle 10 s) keeps the stream alive meanwhile.
	timeout client 30m
	timeout server 30m

listen pg_primary
	bind 127.0.0.1:5000
	option httpchk
	http-check send meth GET uri /primary
	http-check expect status 200
	default-server inter 1s fastinter 500ms downinter 1s fall 2 rise 2 on-marked-down shutdown-sessions
	server mc-pg-01 192.168.1.247:5432 check port 8008
	server mc-pg-02 192.168.1.248:5432 check port 8008

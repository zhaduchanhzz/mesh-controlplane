;; P13f (owner decision D9b): per-cluster PgBouncer aliases. NOT APPLIED
;; (README.md). One alias per cluster on the same physical database, so one
;; cluster's load cannot take every server connection (ADR 0005: one
;; application role for every cluster, no per-cluster role; ADR 0006 §3.7).
;;
;; Included from the [databases] section of pgbouncer.ini on each PgBouncer
;; (mc-pg-01 and mc-pg-02 after P13a/P13b: `%include
;; /etc/pgbouncer/pgbouncer-clusters.ini`). host/port point at the local
;; HAProxy that follows the Patroni primary (P13b). On the single PgBouncer
;; of mc-db (before P13a) use host=mc-pg port=5432 instead.
;;
;; The limits are per PgBouncer instance: with two instances in the client
;; DSN host list, PostgreSQL may see up to twice the sum (README.md
;; "max_connections").
;;
;; pool_size:          server connections kept for the alias (per user, the
;;                     only user is the application role `headscale`)
;; max_db_connections: hard cap of server connections of the alias; clients
;;                     past it queue in PgBouncer (query_wait_timeout = 5 s,
;;                     below the 8 s lease self-fence deadline, ADR 0006 §3.4)

[databases]
; Data pools of the cluster processes (database.postgres.name of each
; cluster's config; Go side: max_open_conns 16, max_idle_conns 4).
mesh_c1 = host=127.0.0.1 port=5000 dbname=meshlab pool_size=16 max_db_connections=20
mesh_c2 = host=127.0.0.1 port=5000 dbname=meshlab pool_size=16 max_db_connections=20

; Lease pools (P13b, ADR 0006 §3.6), one per cluster so a saturated data
; pool of one cluster never delays another cluster's renewals.
mesh_c1_lease = host=127.0.0.1 port=5000 dbname=meshlab pool_size=2 max_db_connections=3
mesh_c2_lease = host=127.0.0.1 port=5000 dbname=meshlab pool_size=2 max_db_connections=3

; Platform services that are not clusters: mesh-placement, mesh-bootstrap
; (read only), the operator CLI. Migrations and fence tools connect to the
; primary directly (ADR 0006 §4), not through PgBouncer.
mesh_ops = host=127.0.0.1 port=5000 dbname=meshlab pool_size=4 max_db_connections=6

; The old catch-all entries ("*" and "meshlab") are removed once every
; process uses its alias, so nothing bypasses the per-cluster caps. Until
; then keep them with a small cap:
; meshlab = host=127.0.0.1 port=5000 dbname=meshlab pool_size=4 max_db_connections=4

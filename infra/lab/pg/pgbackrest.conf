# pgBackRest on the PG nodes of the lab HA cluster mc-pg (P13c, ADR 0012).
# Installed as /etc/pgbackrest/pgbackrest.conf on mc-pg-01/02 by
# setup-pgbackrest.sh. The cipher passphrase is NOT here: it is in
# /etc/pgbackrest/conf.d/cipher.conf (root:postgres 0640), built on the node
# from /etc/mc-pg/pgbackrest.pass.
#
# Repository: mc-db (192.168.1.243) over SFTP, user pgbackrest (SFTP only,
# setup-pgbackrest-repo.sh), outside the PostgreSQL failure domain. Both
# nodes use the same repository: the primary archives WAL
# (archive_command, Patroni DCS) and runs backups; either node can restore.
[global]
repo1-type=sftp
repo1-path=/var/lib/pgbackrest-mc-pg/repo
repo1-sftp-host=192.168.1.243
repo1-sftp-host-user=pgbackrest
repo1-sftp-private-key-file=/var/lib/postgresql/.ssh/pgbackrest_ed25519
repo1-sftp-public-key-file=/var/lib/postgresql/.ssh/pgbackrest_ed25519.pub
# mc-db's host keys, read over the operator's authenticated SSH by deploy.sh
# (no trust on first use).
repo1-sftp-host-key-check-type=strict
# Required by pgBackRest 2.60 for SFTP even with known_hosts checking.
repo1-sftp-host-key-hash-type=sha256
repo1-sftp-known-host=/var/lib/postgresql/.ssh/known_hosts_pgbackrest
repo1-cipher-type=aes-256-cbc
# Two full backups and the WAL they need (lab: < 1 GB per backup today).
repo1-retention-full=2
compress-type=zst
process-max=2
start-fast=y
log-level-console=warn
log-level-file=info
log-path=/var/log/pgbackrest

[mc-pg]
pg1-path=/var/lib/postgresql/16/mc-pg
pg1-port=5432
pg1-socket-path=/var/run/postgresql
